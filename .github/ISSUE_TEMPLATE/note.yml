name: 메모
description: 해결한 문제나 자주 쓰는 설정을 기록합니다.
title: "[분류] "
body:
  - type: dropdown
    id: category
    attributes:
      label: 분류
      description: 고른 값과 같은 이름의 라벨이 자동으로 붙습니다.
      options:
        - Flutter
        - Android
        - Windows
        - WSL/Linux
        - Git
        - Next.js
        - JavaScript
        - HTML/CSS
        - Java
        - Spring
        - DB
        - SQL
        - Algorithm
        - CS
        - ETC
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: 환경
      description: OS, 도구, 버전 등
      placeholder: "예: Windows 11, Flutter 3.24"

  - type: textarea
    id: problem
    attributes:
      label: 상황 / 목적
      description: 어떤 문제가 있었는지, 무엇을 하려고 했는지
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 해결 방법
      description: 명령어나 설정은 코드 블록에 언어를 적어 주세요. (예: ```powershell)
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: 참고
      description: 참고한 문서, 링크, 스크린샷
