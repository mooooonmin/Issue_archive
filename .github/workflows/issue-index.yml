name: Update Issue Index

on:
  issues:
    types:
      - opened
      - edited
      - reopened
      - closed
      - deleted
      - labeled
      - unlabeled
  workflow_dispatch:

permissions:
  contents: write
  issues: write

# 이슈를 만들고 바로 닫으면 실행이 두 번 겹쳐 README push가 충돌하므로 한 번에 하나씩 돌린다.
concurrency:
  group: issue-index
  cancel-in-progress: false

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      # 이슈 이벤트의 기본값은 이벤트가 생긴 시점의 커밋이라, 줄을 서서 늦게 시작해도 옛 README를 받는다. 최신 기본 브랜치를 받는다.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Labels added with GITHUB_TOKEN don't start another run, so there is no loop.
      - name: Apply category label
        if: github.event_name == 'issues' && (github.event.action == 'opened' || github.event.action == 'edited')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/apply-category-label.mjs

      - name: Generate issue index
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          README_PATH: README.md
        run: node scripts/update-issue-index.mjs

      - name: Commit changes
        run: |
          if git diff --quiet README.md; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: update issue index"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
